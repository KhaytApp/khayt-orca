name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Runners no longer carry 3.9; it is checked locally on macOS's own 3.9.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "cryptography>=42,<47"
      - name: Every test runs (none skipped for a missing cryptography)
        run: python -m unittest discover -s tests -t . -v
