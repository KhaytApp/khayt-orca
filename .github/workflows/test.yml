name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # OrcaSlicer 2.5.1 runs plugins on its bundled CPython 3.12 (deps/python3);
        # the floor in pyproject.toml is that version.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "cryptography>=42,<47"
      - name: OrcaSlicer asks once (permission budget)
        run: python -m unittest tests.test_orca_permissions -v
      - name: Every test runs (none skipped for a missing cryptography)
        run: python -m unittest discover -s tests -t . -v
